[project]
name = "hybridsort"
version = "0.1.0"
description = "Visualizador de lista híbrida com busca binária e sequencial"
readme = "README.md"
authors = [
    { name = "Andrew Souza", email = "andrewgab68@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.2.0",
    "streamlit==1.57.0",
]

[project.scripts]
hybridsort = "hybridsort:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
